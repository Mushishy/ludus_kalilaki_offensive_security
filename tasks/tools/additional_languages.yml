- name: Install C# support
  ansible.builtin.apt:
    name:
      - mono-complete
      - libssl-dev
      - libcurl4-openssl-dev
    state: present

- name: Install C++ and build toolchain support
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - ninja-build
      - pkg-config
      - gdb
      - valgrind
      - mingw-w64
      - gcc-mingw-w64
      - g++-mingw-w64
      - libssl-dev
      - libcurl4-openssl-dev
      - libpcap-dev
      - libnet1-dev
      - libffi-dev
      - zlib1g-dev
      - nasm
    state: present

- name: Install Go support
  ansible.builtin.apt:
    name:
      - golang-go
    state: present

- name: Install PowerShell
  ansible.builtin.apt:
    name:
      - powershell
    state: present

- name: Install Python + Python pip support
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-dev
      - python3-venv
    state: present

- name: Install Python pyenv support
  ansible.builtin.apt:
    name:
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - curl
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libffi-dev
      - liblzma-dev
      - pyenv
    state: present
